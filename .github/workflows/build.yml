name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mingw32 toolchain
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-i686
      - name: Build d3d9.dll
        run: make clean && make
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: d3d9.dll
          path: d3d9.dll
